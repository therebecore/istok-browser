org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Daemon включён - он сильно ускоряет повторные сборки.
# Гасится скриптом .tools/stop.ps1 в конце каждой сессии: требование пользователя,
# чтобы вне времени разработки в фоне ничего не висело.
org.gradle.daemon=true

kotlin.code.style=official

# android.useAndroidX и android.nonTransitiveRClass здесь отсутствуют намеренно:
# AndroidX-зависимостей в проекте нет вообще, а nonTransitiveRClass в AGP 9
# уже поведение по умолчанию, а не опция.

# Номер и имя версии (ADR-049). Держим здесь, а не в build.gradle.kts, чтобы выпуск
# менял одну строку данных, а не логику сборки, и чтобы стенд проверки обновления
# и CI могли подставить своё штатным `-PistokVersionCode=N`, без правки файлов.
#
# istokVersionCode растёт на единицу с КАЖДЫМ выпущенным APK и никогда не уменьшается:
# телевизор откажется ставить сборку с номером меньше установленной.
# istokVersionName - для человека, он же имя тега: v0.1.0.
istokVersionCode=16
istokVersionName=0.1.15
